<section class="auth-card">
  <h1>Login</h1>

  @if (errorMessage()) {
    <p class="error" role="alert">{{ errorMessage() }}</p>
  }

  <!--[form group] connects the form to the form object in the ts class - no validate turns of browser validation to allow this validation-->
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autoComplete="email" />
    @if (showError('email'); as msg) {
      <small class="error">Enter a valid email address </small>
    }

    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password" autoComplete="password" />
    @if (showError('password'); as msg) {
      <small class="error">Password is required</small>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Logging in...' : 'Login' }}
    </button>
  </form>

  <p>New to Trial Compass?<a href="/register">Create an account</a></p>
</section>
