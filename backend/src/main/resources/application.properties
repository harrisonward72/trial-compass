spring.application.name=TrialCompass

##Database config
spring.datasource.url=jdbc:mysql://localhost:3306/trialcompass
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

##cors
app.cors.allowed-origins=http://localhost:4200

#JWT secret key
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

#api urls
app.clinicaltrials.base-url =https://clinicaltrials.gov/api/v2
app.geocoding.base-url=https://api.zippopotam.us

